<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embed Test</title>
</head>
<body style="margin:0;padding:16px;font-family:sans-serif;">
  <h1>Third-party site test</h1>
  <p style="color:#b45309;background:#fffbeb;padding:12px;border-radius:8px;font-size:14px;">
    <strong>Do not open this file directly (file://).</strong>
    Browsers block file → localhost iframes.<br />
    Use instead: <a href="http://localhost:3000/test-embed">http://localhost:3000/test-embed</a>
    (with <code>yarn dev</code> running).
  </p>
  <iframe
    src="http://localhost:3000/embed/todays-rates"
    width="100%"
    height="520"
    frameborder="0"
    style="border:1px solid #ccc;max-width:100%;"
    title="Today's Mortgage Rates"
  ></iframe>
</body>
</html>
